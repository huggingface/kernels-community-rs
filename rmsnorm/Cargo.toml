# SPDX-License-Identifier: BSD-2-Clause

[package]
name = "rmsnorm"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

[lib]
name = "rmsnorm"

[workspace]

# Kernels and host code live in this crate. kernel-builder compiles it with
# the cuda-oxide codegen backend and links the kernels as SASS.
[dependencies]
cuda-core = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
cuda-device = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
cuda-host = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
half = "2"
kernels-cuda = { git = "https://github.com/huggingface/kernels.git", rev = "ac45b5ad64da986497e57141dcef2f56a207bc46" }
tvm-ffi = "=0.1.14-post1"

[lints.rust]
# kernel-builder sets `cuda_arch` for every capability it compiles.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cuda_arch, values(any()))'] }
